name: Unit Tests

on:
  push:
  workflow_dispatch: {}
  pull_request: {}

jobs:
  python-client-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          pip3 install .
          pip3 install .[tests]
      - name: Running Tests
        run: |
          pytest tests/test_spot_check_datasets.py
